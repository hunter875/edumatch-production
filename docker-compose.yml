# Docker Compose for Testing - ONLY Auth Service & Matching Service
# Comment out all unnecessary services

services:

  # === REDIS (Distributed cache for Java services) ===
  redis:
    image: redis:7-alpine
    container_name: redis-cache-test
    ports:
      - "6379:6379"
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
  
  # === AUTH DATABASE (MySQL for Auth Service) ===
  auth-db:
    image: mysql:8.0
    container_name: auth-db-test
    environment:
      - MYSQL_ROOT_PASSWORD=${AUTH_DB_ROOT_PASSWORD:?Set AUTH_DB_ROOT_PASSWORD in .env}
      - MYSQL_DATABASE=auth_db
      - MYSQL_USER=auth_user
      - MYSQL_PASSWORD=${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
      - MYSQL_ROOT_HOST=%
    ports:
      - "3307:3306"
    volumes:
      - auth_test_data:/var/lib/mysql
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: --default-authentication-plugin=mysql_native_password
    deploy:
      resources:
        limits:
          memory: 384M # MySQL test instance thường chỉ cần tầm này
        reservations:
          memory: 128M

  # === SCHOLARSHIP DATABASE (MySQL for Scholarship Service) ===
  scholarship-db:
    image: mysql:8.0
    container_name: scholarship-db-test
    environment:
      - MYSQL_ROOT_PASSWORD=${SCHOLARSHIP_DB_ROOT_PASSWORD:?Set SCHOLARSHIP_DB_ROOT_PASSWORD in .env}
      - MYSQL_DATABASE=scholarship_db
      - MYSQL_USER=scholarship_user
      - MYSQL_PASSWORD=${SCHOLARSHIP_DB_PASSWORD:?Set SCHOLARSHIP_DB_PASSWORD in .env}
      - MYSQL_ROOT_HOST=%
    ports:
      - "3308:3306"
    volumes:
      - scholarship_test_data:/var/lib/mysql
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: --default-authentication-plugin=mysql_native_password
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M

  # === AUTH SERVICE (Java - Port 8081) ===
  auth-service:
    build:
      context: ./backend-java/auth-service
      dockerfile: Dockerfile
    container_name: auth-service-test
    ports:
      - "19081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=mysql
      - SPRING_DATASOURCE_URL=jdbc:mysql://auth-db:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=auth_user
      - SPRING_DATASOURCE_PASSWORD=${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
      - APP_JWT_SECRET=${EDUMATCH_JWT_SECRET:?Set EDUMATCH_JWT_SECRET in .env}
      - APP_JWT_EXPIRATION=900000
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME in .env}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME:?Set SPRING_MAIL_USERNAME in .env}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD:?Set SPRING_MAIL_PASSWORD in .env}
      - APP_SERVICES_SCHOLARSHIP_SERVICE_URL=http://scholarship-service:8082
      - SPRING_JPA_SHOW_SQL=false
      - MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=always
      - SPRING_CACHE_TYPE=redis
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - MANAGEMENT_HEALTH_REDIS_ENABLED=true
      - OTEL_SERVICE_NAME=auth-service
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
      - APP_VERSION=${APP_VERSION:-local}
      - GIT_COMMIT=${GIT_COMMIT:-local}
      - DEPLOY_ENVIRONMENT=${DEPLOY_ENVIRONMENT:-local}
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY=INFO
      - LOGGING_LEVEL_COM_EXAMPLE_JWT_EXAMPLE=INFO
      # Giới hạn JVM Heap để Java không ăn quá limit của Docker
      - JAVA_TOOL_OPTIONS=-javaagent:/opt/applicationinsights-agent.jar -XX:InitialRAMPercentage=20.0 -XX:MaxRAMPercentage=70.0 -Dfile.encoding=UTF-8
    depends_on:
      auth-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8081/api/auth/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 512M # Đủ cho Spring Boot chạy test cơ bản
        reservations:
          memory: 256M

  # === MATCHING SERVICE (Python - Port 8000) ===
  matching-service:
    build:
      context: ./matching-service
      dockerfile: Dockerfile
    container_name: matching-service-test
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://matching_user:${MATCHING_DB_PASSWORD:?Set MATCHING_DB_PASSWORD in .env}@matching-db:5432/matching_db
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME in .env}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      - JWT_SECRET=${EDUMATCH_JWT_SECRET:?Set EDUMATCH_JWT_SECRET in .env}
      - JWT_ALGORITHM=HS256
      - RUN_MIGRATIONS=true
      - AUTO_CREATE_TABLES=false
      - OTEL_SERVICE_NAME=matching-service
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
      - APP_VERSION=${APP_VERSION:-local}
      - GIT_COMMIT=${GIT_COMMIT:-local}
      - DEPLOY_ENVIRONMENT=${DEPLOY_ENVIRONMENT:-local}
    depends_on:
      matching-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - test-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 300M # Python nhẹ hơn Java
        reservations:
          memory: 128M

  # === MATCHING CONSUMER (RabbitMQ Event Consumer) ===
  matching-consumer:
    profiles:
      - workers
    build:
      context: ./matching-service
      dockerfile: Dockerfile
    container_name: matching-consumer-test
    environment:
      - DATABASE_URL=postgresql://matching_user:${MATCHING_DB_PASSWORD:?Set MATCHING_DB_PASSWORD in .env}@matching-db:5432/matching_db
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME in .env}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      - JWT_SECRET=${EDUMATCH_JWT_SECRET:?Set EDUMATCH_JWT_SECRET in .env}
      - JWT_ALGORITHM=HS256
      - RUN_MIGRATIONS=false
      - AUTO_CREATE_TABLES=false
      - OTEL_SERVICE_NAME=matching-consumer
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
      - APP_VERSION=${APP_VERSION:-local}
      - GIT_COMMIT=${GIT_COMMIT:-local}
      - DEPLOY_ENVIRONMENT=${DEPLOY_ENVIRONMENT:-local}
    depends_on:
      matching-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - test-network
    command: python -m app.consumer
    healthcheck:
      disable: true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # === MATCHING DATABASE (PostgreSQL for Matching Service) ===
  matching-db:
    image: postgres:14-alpine
    container_name: matching-db-test
    environment:
      - POSTGRES_USER=matching_user
      - POSTGRES_PASSWORD=${MATCHING_DB_PASSWORD:?Set MATCHING_DB_PASSWORD in .env}
      - POSTGRES_DB=matching_db
    ports:
      - "5432:5432"
    volumes:
      - matching_test_data:/var/lib/postgresql/data
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matching_user -d matching_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # === RABBITMQ (Required for both services) ===
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-test
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME in .env}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # === FRONTEND (Next.js) ===
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_GATEWAY: http://localhost:19080
        NEXT_PUBLIC_API_URL: http://localhost:19080
        NEXT_PUBLIC_SOCKET_URL: ws://localhost:19080/api/ws
    container_name: frontend-test
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_GATEWAY=http://localhost:19080
      - NEXT_PUBLIC_SOCKET_URL=ws://localhost:19080/api/ws
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    networks:
      - test-network
    depends_on:
      - api-gateway
    deploy:
      resources:
        limits:
          memory: 1G # Frontend dev server cần khá nhiều RAM
        reservations:
          memory: 512M

  # === API GATEWAY (Nginx) ===
  api-gateway:
    image: nginx:alpine
    container_name: api-gateway-test
    ports:
      - "19080:80"
    volumes:
      - ./nginx-gateway/nginx.local.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth-service:
        condition: service_healthy
      scholarship-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      matching-service:
        condition: service_healthy
    networks:
      - test-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # === SCHOLARSHIP SERVICE (Java - Port 8082) ===
  scholarship-service:
    build:
      context: ./backend-java/scholarship-service
      dockerfile: Dockerfile
    container_name: scholarship-service-test
    ports:
      - "19082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:mysql://scholarship-db:3306/scholarship_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=scholarship_user
      - SPRING_DATASOURCE_PASSWORD=${SCHOLARSHIP_DB_PASSWORD:?Set SCHOLARSHIP_DB_PASSWORD in .env}
      - APP_JWT_SECRET=${EDUMATCH_JWT_SECRET:?Set EDUMATCH_JWT_SECRET in .env}
      - JWT_SECRET=${EDUMATCH_JWT_SECRET:?Set EDUMATCH_JWT_SECRET in .env}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME in .env}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      - AUTH_SERVICE_URL=http://auth-service:8081
      - MATCHING_SERVICE_URL=http://matching-service:8000
      - SPRING_JPA_SHOW_SQL=false
      - MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=always
      - SPRING_CACHE_TYPE=redis
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - MANAGEMENT_HEALTH_REDIS_ENABLED=true
      - OTEL_SERVICE_NAME=scholarship-service
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
      - APP_VERSION=${APP_VERSION:-local}
      - GIT_COMMIT=${GIT_COMMIT:-local}
      - DEPLOY_ENVIRONMENT=${DEPLOY_ENVIRONMENT:-local}
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY=INFO
      - LOGGING_LEVEL_COM_EDUMATCH_SCHOLARSHIP=INFO
      # Giới hạn JVM
      - JAVA_TOOL_OPTIONS=-javaagent:/opt/applicationinsights-agent.jar -XX:InitialRAMPercentage=20.0 -XX:MaxRAMPercentage=70.0 -Dfile.encoding=UTF-8
    depends_on:
      scholarship-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8082/debug/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 200M

  # === CHAT SERVICE (Java - Port 8083) ===
  chat-service:
    build:
      context: ./backend-java/chat-service
      dockerfile: Dockerfile
    container_name: chat-service-test
    ports:
      - "19083:8083"
      # WebSocket runs on the same Spring Boot port at /api/ws.
      # Local FE should use the gateway URL: ws://localhost:19080/api/ws.
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:mysql://chat-db-test:3306/chat_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=chat_user
      - SPRING_DATASOURCE_PASSWORD=${CHAT_DB_PASSWORD:?Set CHAT_DB_PASSWORD in .env}
      - APP_JWT_SECRET=${EDUMATCH_JWT_SECRET:?Set EDUMATCH_JWT_SECRET in .env}
      - JWT_SECRET=${EDUMATCH_JWT_SECRET:?Set EDUMATCH_JWT_SECRET in .env}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME in .env}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME in .env}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      - APP_FIREBASE_ENABLED=false
      - APP_FIREBASE_SDK_PATH=classpath:firebase-adminsdk-key.json
      - SPRING_JPA_SHOW_SQL=false
      - MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=always
      - OTEL_SERVICE_NAME=chat-service
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
      - APP_VERSION=${APP_VERSION:-local}
      - GIT_COMMIT=${GIT_COMMIT:-local}
      - DEPLOY_ENVIRONMENT=${DEPLOY_ENVIRONMENT:-local}
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY=INFO
      - LOGGING_LEVEL_COM_EDUMATCH_CHAT=INFO
      # Giới hạn JVM
      - JAVA_TOOL_OPTIONS=-javaagent:/opt/applicationinsights-agent.jar -XX:InitialRAMPercentage=20.0 -XX:MaxRAMPercentage=70.0 -Dfile.encoding=UTF-8
    depends_on:
      chat-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8083/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 200M

  # === CHAT DATABASE (MySQL for Chat Service) ===
  chat-db:
    image: mysql:8.0
    container_name: chat-db-test
    environment:
      - MYSQL_ROOT_PASSWORD=${CHAT_DB_ROOT_PASSWORD:?Set CHAT_DB_ROOT_PASSWORD in .env}
      - MYSQL_DATABASE=chat_db
      - MYSQL_USER=chat_user
      - MYSQL_PASSWORD=${CHAT_DB_PASSWORD:?Set CHAT_DB_PASSWORD in .env}
      - MYSQL_ROOT_HOST=%
    ports:
      - "3309:3306"
    volumes:
      - chat_test_data:/var/lib/mysql
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: --default-authentication-plugin=mysql_native_password
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M

# === NETWORKS & VOLUMES ===

networks:
  test-network:
    driver: bridge

volumes:
  matching_test_data:
  auth_test_data:
  scholarship_test_data:
  chat_test_data:
