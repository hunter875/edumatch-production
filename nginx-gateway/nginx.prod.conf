        }
        
        # Serve uploaded files from auth service
        location /uploads {
            proxy_pass $auth_backend;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
