# ================================================
# Nginx API Gateway - EduMatch (PRODUCTION)
# Routes production traffic to backend microservices.
# ================================================

events {
    worker_connections 1024;
}

http {
    # Azure DNS for variable proxy_pass targets rendered at container startup.
    resolver 168.63.129.16 ipv6=off valid=30s;
    map_hash_bucket_size 128;

    # ================================================
    # PRODUCTION CORS ALLOWLIST
    # Replace these placeholder domains with the real frontend origins before deploy.
    # Disallowed origins get no Access-Control-Allow-Origin header, so browsers block them.
    # ================================================

    map $http_origin $cors_origin {
        default "";
        "https://${FRONTEND_HOST}" $http_origin;
        "~^https://edumatch\.your-domain\.com$" $http_origin;
        "~^https://www\.edumatch\.your-domain\.com$" $http_origin;
    }

    map $cors_origin $cors_credentials {
        default "";
        "~.+" "true";
    }

    # ================================================
    # UPSTREAM DEFINITIONS
    # Kept for compatibility, but Azure Container Apps uses rendered HTTPS
    # backend variables in the server block below.
    # ================================================
    
    upstream auth_service {
        server ${AUTH_SERVICE_HOST}:443;
    }
    
    upstream scholarship_service {
        server ${SCHOLARSHIP_SERVICE_HOST}:443;
    }
    
    upstream chat_service {
        server ${CHAT_SERVICE_HOST}:443;
    }
    
    upstream matching_service {
        server ${MATCHING_SERVICE_HOST}:443;
    }
    
    # ================================================
    # RATE LIMITING ZONES
    # ================================================
    
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=ml_limit:10m rate=5r/s;
    limit_req_status 429;

    map $http_x_request_id $proxy_request_id {
        default $http_x_request_id;
        "" $request_id;
    }

    log_format gateway_json escape=json
        '{"timestamp":"$time_iso8601","requestId":"$proxy_request_id","traceparent":"$http_traceparent",'
        '"method":"$request_method","path":"$request_uri","status":$status,'
        '"requestTime":$request_time,"upstreamResponseTime":"$upstream_response_time",'
        '"upstreamStatus":"$upstream_status","remoteAddr":"$remote_addr","userAgent":"$http_user_agent"}';
    
    # Request body size limit
    client_max_body_size 10M;

    # ================================================
    # MAIN SERVER BLOCK
    # ================================================
    
    server {
        listen 80;
        server_name edumatch.your-domain.com;
        
        # Logging
        access_log /var/log/nginx/access.log gateway_json;
        error_log /var/log/nginx/error.log warn;

        server_tokens off;

        set $auth_backend "https://${AUTH_SERVICE_HOST}";
        set $scholarship_backend "https://${SCHOLARSHIP_SERVICE_HOST}";
        set $chat_backend "https://${CHAT_SERVICE_HOST}";
        set $matching_backend "https://${MATCHING_SERVICE_HOST}";
        set $frontend_backend "https://${FRONTEND_HOST}";

        proxy_ssl_server_name on;

        # Baseline browser hardening.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        error_page 429 = @rate_limited;

        location @rate_limited {
            default_type application/json;
            add_header Retry-After 30 always;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials $cors_credentials always;
            add_header Vary Origin always;
            return 429 '{"timestamp":"$time_iso8601","status":429,"code":"RATE_LIMITED","message":"Too many requests","path":"$request_uri"}';
        }
        
        # ================================================
        # GATEWAY HEALTH CHECK
        # ================================================
        
        location /gateway/health {
            access_log off;
            return 200 '{"status":"healthy","gateway":"EduMatch-API-Gateway","environment":"production","services":["auth","scholarship","matching","chat"]}';
            add_header Content-Type application/json;
        }
        
        location /gateway/status {
            access_log off;
            return 200 '{"gateway":"healthy","environment":"production","services":{"auth":"configured","scholarship":"configured","matching":"configured","chat":"configured"}}';
            add_header Content-Type application/json;
        }

        # ================================================
        # AUTH SERVICE (Java - Port 8081)
        # ================================================
        
        location /api/auth {
            # CORS - Support credentials (cookies, authorization headers)
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Credentials $cors_credentials always;
                add_header Vary Origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
                add_header Access-Control-Max-Age 3600 always;
                add_header Content-Length 0;
                return 204;
            }

            # Compatibility rewrites for FE expectations
            # 1) Old FE path -> current auth path
            rewrite ^/api/auth/user/me$ /api/auth/me break;
            
            limit_req zone=auth_limit burst=20 nodelay;
            
            # Hide upstream CORS to avoid duplicates
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            
            proxy_pass $auth_backend;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $proxy_request_id;
            proxy_set_header traceparent $http_traceparent;
            proxy_set_header tracestate $http_tracestate;
            proxy_set_header baggage $http_baggage;            
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # Ensure CORS headers on ALL responses (not just OPTIONS)
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials $cors_credentials always;
            add_header Vary Origin always;
        }
        
        location /api/user {
            # CORS - Support credentials
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Credentials $cors_credentials always;
