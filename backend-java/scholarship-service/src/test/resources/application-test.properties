# Test Configuration - Scholarship Service
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.enabled=false

# Disable RabbitMQ for tests
spring.rabbitmq.host=localhost
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# JWT Config for tests
app.jwt.secret=test_secret_key_for_unit_tests_only
app.jwt.algorithm=HS512

# Mock external services
app.services.matching-service.url=http://localhost:8000

spring.data.web.pageable.default-page-size=12
spring.data.web.pageable.max-page-size=100
spring.cache.type=simple
management.health.redis.enabled=false
