# === Application Configuration ===
server.port=8083
spring.application.name=chat-service

# === Database Configuration ===
# Local: jdbc:mysql://localhost:3306/chat_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# Docker: jdbc:mysql://chat-db-test:3306/chat_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=1

# === RabbitMQ Configuration ===
# Local: localhost | Docker: rabbitmq-test | Azure: Service Bus connection
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq-test}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
app.rabbitmq.exchange=events_exchange

# === Security Configuration ===
app.jwt.secret=${JWT_SECRET}
app.jwt.require-rsa=${APP_JWT_REQUIRE_RSA:false}
app.jwt.header=Authorization
app.jwt.prefix=Bearer

# === Firebase Configuration ===
app.firebase.enabled=${APP_FIREBASE_ENABLED:true}
app.firebase.sdk-path=classpath:firebase-adminsdk-key.json

# === Other Services URLs ===
app.services.auth-service.url=${AUTH_SERVICE_URL:http://auth-service-test:8081}

# === Logging ===
logging.level.org.springframework.security=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY:INFO}
logging.level.com.edumatch.chatservice=${LOGGING_LEVEL_COM_EDUMATCH_CHAT:INFO}

# === Observability ===
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:when-authorized}
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.service=chat-service
management.metrics.tags.environment=${DEPLOY_ENVIRONMENT:local}
management.metrics.tags.version=${APP_VERSION:local}
management.metrics.tags.commit=${GIT_COMMIT:local}
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.environment=${DEPLOY_ENVIRONMENT:local}
info.app.version=${APP_VERSION:local}
info.app.commit=${GIT_COMMIT:local}

# === API pagination guardrails ===
spring.data.web.pageable.default-page-size=${SPRING_DATA_WEB_PAGEABLE_DEFAULT_PAGE_SIZE:20}
spring.data.web.pageable.max-page-size=${SPRING_DATA_WEB_PAGEABLE_MAX_PAGE_SIZE:100}
