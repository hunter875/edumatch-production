spring.application.name=jwt_my_example
server.port=8081

# --- Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=1

# --- JWT

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}
app.jwtRefreshExpirationMs=${APP_JWT_REFRESH_EXPIRATION_MS:604800000}
app.jwt.header=Authorization
app.jwt.prefix=Bearer

# --- C?u h�nh RabbitMQ ---
# Local: localhost | Docker: rabbitmq-test | Azure: Service Bus connection
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.template.exchange=events_exchange

# --- Logging ---
logging.level.org.springframework.security=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY:INFO}
logging.level.com.example.jwt.example=${LOGGING_LEVEL_COM_EXAMPLE_JWT_EXAMPLE:INFO}

# --- Observability ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:always}
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.service=auth-service
management.metrics.tags.environment=${DEPLOY_ENVIRONMENT:local}
management.metrics.tags.version=${APP_VERSION:local}
management.metrics.tags.commit=${GIT_COMMIT:local}
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.environment=${DEPLOY_ENVIRONMENT:local}
info.app.version=${APP_VERSION:local}
info.app.commit=${GIT_COMMIT:local}

# --- SMTP
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}

# --- File Upload Configuration ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=${APP_UPLOAD_DIR:uploads}
app.upload.base-url=${APP_UPLOAD_BASE_URL:http://localhost:8081/uploads}

# --- API pagination guardrails ---
spring.data.web.pageable.default-page-size=${SPRING_DATA_WEB_PAGEABLE_DEFAULT_PAGE_SIZE:20}
spring.data.web.pageable.max-page-size=${SPRING_DATA_WEB_PAGEABLE_MAX_PAGE_SIZE:100}

# --- Cache / Redis ---
spring.cache.type=${SPRING_CACHE_TYPE:redis}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:2s}
management.health.redis.enabled=${MANAGEMENT_HEALTH_REDIS_ENABLED:true}
