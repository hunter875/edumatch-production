# Application properties for Docker environment
spring.application.name=jwt_my_example
server.port=8081

# --- H2 In-Memory Database (for Docker testing)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}

# H2 Console (disabled in Docker)
spring.h2.console.enabled=false

# --- JWT Configuration
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=${APP_JWT_EXPIRATION:900000}
app.jwtRefreshExpirationMs=${APP_JWT_REFRESH_EXPIRATION_MS:604800000}
app.jwt.require-rsa=${APP_JWT_REQUIRE_RSA:false}
app.jwt.header=Authorization
app.jwt.prefix=Bearer

# --- Auth cookies
app.auth.cookie.secure=${APP_AUTH_COOKIE_SECURE:false}
app.auth.cookie.domain=${APP_AUTH_COOKIE_DOMAIN:}

# --- RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# --- Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:when-authorized}
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.service=auth-service

# --- Logging
logging.level.org.springframework.security=INFO
logging.level.com.example.jwt.example=INFO
