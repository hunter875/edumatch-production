# Application properties for MySQL (Docker testing)
spring.application.name=jwt_my_example
server.port=8081

# --- MySQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=1

# --- JWT Configuration
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=${APP_JWT_EXPIRATION:900000}
app.jwtRefreshExpirationMs=${APP_JWT_REFRESH_EXPIRATION_MS:604800000}
app.jwt.require-rsa=${APP_JWT_REQUIRE_RSA:false}
app.jwt.header=Authorization
app.jwt.prefix=Bearer

# --- Auth cookies
app.auth.cookie.secure=${APP_AUTH_COOKIE_SECURE:false}
app.auth.cookie.domain=${APP_AUTH_COOKIE_DOMAIN:}

# --- RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# --- Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:when-authorized}
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.service=auth-service

# --- Logging
logging.level.org.springframework.security=INFO
logging.level.com.example.jwt.example=${LOGGING_LEVEL_COM_EXAMPLE_JWT_EXAMPLE:INFO}

# --- File Upload Configuration ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads
app.upload.base-url=${APP_UPLOAD_BASE_URL:http://localhost:8080/uploads}
